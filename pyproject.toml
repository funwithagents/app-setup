[project]
name = "module-setup"
version = "0.1.0"
description = "The Setup side of a module-based app: choose a module, edit its config from its schema, install its extra, prepare what it needs, then start a session."
readme = "README.md"
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "packaging>=26.3",
]

[project.optional-dependencies]
# The page: the Setup, Secrets and Session tabs drawn with gradio (specs/ui.md). The base
# install decides everything and draws nothing, so a library that only runs the conformance
# check in its tests never installs gradio.
ui = [
    "gradio>=6,<7",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # The ui extra, so the page is type-checked and tested in the dev loop.
    "module-setup[ui]",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.sources]
# Self-reference for the dev group above, which pulls the package's own extra.
module-setup = { workspace = true }

[tool.ruff]
target-version = "py311"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
